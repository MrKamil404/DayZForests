[workspace]
resolver = "2"
members = [
    "crates/forest-core",
    "crates/forest-cli",
    "crates/forest-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DayZForests"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
